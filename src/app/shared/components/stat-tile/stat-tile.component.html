<div class="stat-tile" [class]="toneClass()">
  @if (icon()) {
    <span class="stat-icon"><i class="pi" [class]="icon()"></i></span>
  }
  <span class="stat-label">{{ label() }}</span>
  <span class="stat-value">
    @if (format() === 'currency') {
      {{ value() | currencyFormat: currency() }}
    } @else {
      {{ value() | number: '1.0-0' }}
    }
  </span>
  @if (deltaPct() !== null && deltaPct() !== undefined) {
    <span class="stat-delta" [class]="deltaDirectionClass()">
      <i class="pi" [class.pi-arrow-up]="deltaDirectionClass() === 'up'" [class.pi-arrow-down]="deltaDirectionClass() === 'down'" [class.pi-minus]="deltaDirectionClass() === 'flat'"></i>
      {{ deltaPct()! | number: '1.0-1' }}%
    </span>
  }
</div>
